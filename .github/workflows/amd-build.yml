name: Build Moodle AMD assets

on:
  push:
    branches: [master]
    paths:
      - 'amd/src/**'
      - '.github/workflows/amd-build.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rank-amd-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Checkout Moodle for official Grunt build
        uses: actions/checkout@v4
        with:
          repository: moodle/moodle
          ref: MOODLE_405_STABLE
          path: moodle

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: moodle/npm-shrinkwrap.json

      - name: Install Moodle build dependencies
        working-directory: moodle
        run: npm ci --no-audit --no-fund

      - name: Build plugin AMD with Moodle Grunt
        run: |
          mkdir -p moodle/mod/rank
          rsync -a --exclude='.git' --exclude='moodle' ./ moodle/mod/rank/
          (cd moodle && npx grunt amd --root=mod/rank)
          cp moodle/mod/rank/amd/build/ranking.min.js amd/build/ranking.min.js
          cp moodle/mod/rank/amd/build/ranking.min.js.map amd/build/ranking.min.js.map
          node --check amd/build/ranking.min.js
          test -s amd/build/ranking.min.js.map

      - name: Commit generated AMD assets
        run: |
          git add amd/build/ranking.min.js amd/build/ranking.min.js.map
          if git diff --cached --quiet; then
            echo 'Built AMD assets are already up to date.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Build AMD assets with Moodle Grunt'
          git push origin HEAD:master
